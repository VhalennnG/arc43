<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Arc43{% endblock %}</title>
    <link rel="icon" type="image/x-icon" href="/assets/arc.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/css/styles.css" />
    <script src="/static/js/htmx.min.js"></script>
  </head>
  <body>
    <div id="global-loader" class="global-loader">
      <div class="loader-content">
        <div class="spinner"></div>
        <p class="loader-text">Processing Request</p>
        <p class="loader-subtext">Please wait, local AI models are running...</p>
      </div>
    </div>
    <div class="container">
      <header>
        <div class="brand">
          <img src="/assets/arc.png" alt="Arc43 Logo" class="brand-logo" />
          <h1>Arc43</h1>
        </div>
      </header>

      <main id="main-content">{% block content %}{% endblock %}</main>
    </div>
  </body>
</html>
